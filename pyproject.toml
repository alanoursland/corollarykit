[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corollarykit"
dynamic = ["version"]
description = "Algorithms from recent mathematics, with every guarantee tied to the theorem it rests on."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Alan Oursland" }]
keywords = ["number theory", "primes", "linear programming", "certificates", "riemann hypothesis"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Rigorous ball arithmetic (li(x) enclosures for prime_count_interval).
arb = ["python-flint>=0.9"]
# Faster exact rationals and big integers.
fast = ["gmpy2>=2.2"]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["corollarykit[test,arb]", "ruff>=0.8", "mypy>=1.13", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/alanoursland/corollarykit"
Issues = "https://github.com/alanoursland/corollarykit/issues"

[tool.hatch.version]
path = "src/corollarykit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/corollarykit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "planning", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
