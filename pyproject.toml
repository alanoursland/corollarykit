[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corollarykit"
dynamic = ["version"]
description = "Algorithms from recent mathematics, with every guarantee tied to the theorem it rests on."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Alan Oursland" }]
keywords = ["number theory", "primes", "linear programming", "certificates", "riemann hypothesis"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Rigorous ball arithmetic (li(x) enclosures for prime_count_interval).
arb = ["python-flint>=0.9"]
# Faster exact rationals and big integers.
fast = ["gmpy2>=2.2"]
test = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3", "pytest-benchmark>=4", "sympy>=1.12"]
# Independent implementations used as test oracles. CI installs these.
# cypari2 joins in M3 (first test that uses PARI), together with a CI step that installs
# PARI/GP: without it, pip falls back to a source build that fails on Python 3.11.
oracles = ["python-flint>=0.9"]
dev = ["corollarykit[test,arb,oracles]", "ruff>=0.8", "mypy>=1.13", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/alanoursland/corollarykit"
Issues = "https://github.com/alanoursland/corollarykit/issues"

[tool.hatch.version]
path = "src/corollarykit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/corollarykit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "planning", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on sys.path so helpers (_data) and the independent verifier (verify) import directly.
# src/ is deliberately NOT on sys.path: tests run against the installed wheel.
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not slow and not bench"]
xfail_strict = true
markers = [
    "slow: nightly only",
    "bench: benchmarks; writes pytest-benchmark JSON",
    "oracle_sympy: needs sympy",
    "oracle_pari: needs cypari2",
    "oracle_flint: needs python-flint",
    "oracle_primecount: needs primecount bindings",
    "oracle_highs: needs highspy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
