# corollarykit basis registry.
#
# A *hypothesis* is an unproved (or newly proved) statement such as RH.
# Each hypothesis lists the *proofs* claimed for it, each with its own status.
#
# A *basis* is a theorem an algorithm relies on. A basis has its own status
# (for a conditional theorem like "RH implies X", the implication itself is
# usually classical) and optionally a hypothesis. Its effective status is the
# weaker of its own status and the best accepted proof of its hypothesis.
#
# Basis fields:
#   statement        exact text of the theorem as used, with constants
#   domain           numeric range of the size variable: { ge, gt, le, lt } (ints; strings for >64-bit)
#   domain_text      the domain in words, for docs
#   requires         preconditions the CALLER must establish (prime, odd, ...); not checked here
#   ceiling          optional search ceiling: { kind = "...", <params as exact rational strings> }
#                    kinds are implemented in corollarykit/_bases.py; there is no eval
#   checked_against  page/theorem/equation and checker name; required once transcription_checked
#
# transcription_checked = false means the statement/constants below have NOT
# yet been checked against the cited source. Policies refuse such bases unless
# explicitly told otherwise. Flip it only with a citation in checked_against,
# in a commit of its own.
#
# Status vocabulary (strongest first): classical, peer-verified, lean-compiled, claimed.
# A lean-compiled proof with statement_match = "unchecked" counts as claimed.

# ---------------------------------------------------------------- hypotheses

[hypotheses.RH]
statement = "All nontrivial zeros of the Riemann zeta function have real part 1/2."

[[hypotheses.RH.proofs]]
id = "alpoge-claude-2026"
source = "L. Alpöge (with Claude), alpo.ge/remark.pdf and Lean archive, 2026-11-20"
status = "lean-compiled"
statement_match = "unchecked"

[hypotheses.GRH-dirichlet]
statement = "For every Dirichlet character chi, all nontrivial zeros of L(s, chi) have real part 1/2."
note = "Does NOT cover Dedekind, Hecke, Artin or other automorphic L-functions."

[[hypotheses.GRH-dirichlet.proofs]]
id = "alpoge-claude-2026"
source = "L. Alpöge (with Claude), alpo.ge/remark.pdf and Lean archive, 2026-11-20"
status = "lean-compiled"
statement_match = "unchecked"

[hypotheses.quasi-GRH-dirichlet]
statement = "No zeta or Dirichlet L-function has a zero with real part > 11/12."
note = "OpenAI's catalog states 7/8; the paper in the repository states 11/12. The registry records the weaker statement."

[[hypotheses.quasi-GRH-dirichlet.proofs]]
id = "openai-quasi-rh-2026"
source = "OpenAI, 'The Quasi-Riemann Hypothesis', openai/math, released 2026-10-06"
status = "claimed"
statement_match = "unchecked"

[hypotheses.no-siegel-zeros]
statement = "Siegel zeros do not exist (exact scope to be recorded from the source)."

[[hypotheses.no-siegel-zeros.proofs]]
id = "openai-siegel-2026"
source = "OpenAI, openai/math, released 2026-10-06"
status = "claimed"
statement_match = "unchecked"

[hypotheses.GRH-dedekind]
statement = "For every number field K, all nontrivial zeros of the Dedekind zeta function of K have real part 1/2."
note = "Needed by class-group algorithms, effective Chebotarev (incl. Kummer fields), nonresidues in extension fields. No proof claimed as of 2026-11-25."
proofs = []

[hypotheses.GRH-hecke]
statement = "For every number field K and Hecke character chi of K, all nontrivial zeros of L(s, chi) have real part 1/2."
note = "Needed by Bach's class-group generator bound and isogeny-graph expansion results. No proof claimed as of 2026-11-25."
proofs = []

